<div class="card mb-3">
    <div class="row">
        <div class="col-4">
            <img src="{{ course.image }}" class="img-fluid rounded-start" alt="{{ course.title }}">
        </div>
        <div class="col-md-8">
            <div class="card-body">
                <h5 class="card-title">{{ course.title }}</h5>
                <p class="card-text">{{ course.description }}</p>
            </div>
        </div>
        
    </div>
</div>

{% load static %}
<div class="card mb-3">
    <div class="row">
        <div class="col-4">
            <img src="{% static 'courses/img/'|add:course.imageUrl %}" class="img-fluid rounded-start" alt="{{ course.title }}">
        </div>
        <div class="col-md-8">
            <div class="card-body">
                <h5 class="card-title">
                    <a href="{% url 'course_details' course.id %}" class="text-decoration-none text-dark">
                    {{ course.title }}
                    </a>
                </h5>
                <p class="card-text">{{ course.description|truncatechars:40 }}</p>
                <p class="card-text"><small class="text-muted">Yayınlanma Tarihi: {{ course.date|date:"SHORT_DATE_FORMAT" }}</small></p>
                
            </div>
        </div>
        
    </div>
</div>

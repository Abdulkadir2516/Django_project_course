{% load static %}
<div class="card mb-3">
    <div class="row">
        <div class="col-4">
            <img src="{% static 'courses/img/'|add:course.image %}" class="img-fluid rounded-start" alt="{{ course.title }}">
        </div>
        <div class="col-md-8">
            <div class="card-body">
                <h5 class="card-title">{{ course.title }}</h5>
                <p class="card-text">{{ course.description|truncatechars:40 }}</p>
                <p class="card-text"><small class="text-muted">Yayınlanma Tarihi: {{ course.date|date:"d F Y" }}</small></p>
                {% if course.isupdated %}
                    <span class="badge bg-success">Güncel</span>
                {% else %}
                    <span class="badge bg-danger">Güncel Değil</span>
                {% endif %}
            </div>
        </div>
        
    </div>
</div>

{% extends 'layout.html' %}

{% load static %}



{% block content %}
    <div class="container mt-3">
        <div class="row">
           <div class="col-12">
            
                {% if error %}
                    <div class="alert alert-danger">
                        Formu Eksiksiz Doldurunuz!
                    </div>
                {% endif %}

                <form action="{% url 'create_course' %}" method="POST" novalidate>
                    {% csrf_token %}

                    {% for field in form  %}
                        <div class="mb-3 {% if field.errors %} invalid {% endif %}">
                            {% if field.errors %} <div class="alert alert-danger"> {{ field.errors }} </div>{% endif %}

                            <label for="{{field.id_for_label}}" class="form-label">{{ field.label }}</label>
                            {{field}}
                        </div>
                    
                    {% endfor %}

                    <button type="submit" class="btn btn-primary">Create Course</button>
                    
                </form>


            
            </div>


        </div>
            

        </div>
    </div>

{% endblock %}

{% block title %} Create Course {% endblock %}

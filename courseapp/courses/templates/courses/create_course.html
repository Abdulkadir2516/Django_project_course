{% extends 'layout.html' %}

{% load static %}



{% block content %}
    <div class="container mt-3">
        <div class="row">
           <div class="col-12">

                <form action="{% url 'create_course' %}" method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="title" class="form-label">Kurs Başlığı</label>
                        <input type="text" class="form-control" id="title" name="title" placeholder="Kurs Başlığı">
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Kurs Açıklaması</label>
                        <textarea class="form-control" id="description" name="description" placeholder="Kurs Açıklaması"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="imageUrl" class="form-label">Kurs Görseli</label>
                        <input type="text" class="form-control" id="imageUrl" name="imageUrl" placeholder="Kurs Görseli">
                    </div>
                    <div class="mb-3">
                        <label for="slug" class="form-label">Kurs Slug</label>
                        <input type="text" class="form-control" id="slug" name="slug" placeholder="Kurs Slug">
                    </div>
                    <div class="form-check" mb-3>
                        <input class="form-check-input" type="checkbox" id="isActive" name="isActive">
                        <label class="form-check-label" for="isActive">
                            Aktif
                        </label>
                    </div>
                    
                    <div class="mb-3">
                        <button type="submit" class="btn btn-primary">Kursu Oluştur</button>

                    </div>
                    
                    



                </form>


            
            </div>


        </div>
            

        </div>
    </div>

{% endblock %}

{% block title %} Create Course {% endblock %}
